# Domain: <domain-name>
# This config drives the pipeline for a new domain.
# Copy this directory (docs/domain/_template/) to create a new domain, e.g.
# docs/domain/<your-domain>/, then fill in the values below. No code changes
# are needed to adapt the pipeline to a new domain.

domain: <domain-name>

# Intent types for query classification (Stage 3). Add/remove intents as the
# domain requires. See src/onto3gpp/runtime/intent.py.
intents:
  - DEFINITION
  - PROCEDURE
  - CONFIGURATION
  - FAILURE

# Deterministic query-intent classification patterns (Stage 3). Each intent
# maps to a list of regexes; a query is classified by counting regex matches
# (ties broken by the latest match position). See src/onto3gpp/runtime/intent.py.
intent_patterns:
  DEFINITION:
    - "\\bwhat is\\b"
    - "\\bwhat are\\b"
    - "\\bdefine\\b"
    - "\\bdefinition\\b"
    - "\\bmeaning\\b"
  PROCEDURE:
    - "\\bhow (does|is|are|do)\\b"
    - "\\bprocedure\\b"
    - "\\bprocess\\b"
    - "\\bsteps?\\b"
  CONFIGURATION:
    - "\\bconfigure\\b"
    - "\\bconfiguration\\b"
    - "\\bsetup\\b"
    - "\\bestablish\\b"
  FAILURE:
    - "\\b(fail|failure|error|break)\\b"
    - "\\bunsuccessful\\b"
    - "\\bnot supported\\b"

# Document metadata fields (spec number, release, clause, title, etc.)
document_metadata:
  - spec_number
  - release
  - version
  - document_type
  - title

# Judge confidence threshold (0-1). Candidates below this are rejected by the
# AI-as-judge gate (see docs/architecture.md §"AI as Judge").
judge_threshold: 0.8

# AI provider/model config is NOT here — it lives in config/app.yaml (app-level).
# Domain packs stay portable; copying _template needs no AI edits.
# To configure providers/models/embed, edit config/app.yaml:
#   llm.enabled + default/models: {provider, model, api_base, api_key_env, temperature, max_tokens}
#   embed: {kind, dim, threshold, top_k, api_base, model, api_key_env}
# Swapping providers is a one-line change in config/app.yaml:
#   cmdc→{provider: cmdc, api_key_env: COMMAND_CODE_API_KEY},
#   openai→{provider: openai, api_key_env: OPENAI_API_KEY},
#   ollama→{provider: ollama, api_base: http://localhost:11434} (no key).
# See ADR-0015 and config/app.yaml.
