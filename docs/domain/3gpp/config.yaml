# Domain: 3GPP
# This config drives the pipeline for 3GPP specifications.
# See docs/domain/_template/ for the schema.

domain: 3gpp

intents:
  - DEFINITION
  - PURPOSE
  - PROCEDURE
  - MESSAGE_FLOW
  - CONFIGURATION
  - PARAMETER
  - FAILURE
  - ERROR_HANDLING
  - SECURITY
  - COMPARISON
  - DEPENDENCY
  - ARCHITECTURE
  - REQUIREMENT

# Deterministic query-intent classification patterns (Stage 3). Each intent
# maps to a list of regexes; a query is classified by counting regex matches
# (ties broken by the latest match position). See src/onto3gpp/runtime/intent.py.
intent_patterns:
  DEFINITION:
    - "\\bwhat is\\b"
    - "\\bwhat are\\b"
    - "\\bdefine\\b"
    - "\\bdefinition\\b"
    - "\\bmeaning\\b"
  PURPOSE:
    - "\\bwhy\\b"
    - "\\bpurpose\\b"
    - "\\bfor what\\b"
    - "\\bintended for\\b"
  PROCEDURE:
    - "\\bhow (does|is|are|do)\\b"
    - "\\bprocedure\\b"
    - "\\bprocess\\b"
    - "\\bsteps?\\b"
  MESSAGE_FLOW:
    - "\\bmessage flow\\b"
    - "\\bsignalling flow\\b"
    - "\\bsequence\\b"
    - "\\bexchange\\b"
  CONFIGURATION:
    - "\\bconfigure\\b"
    - "\\bconfiguration\\b"
    - "\\bsetup\\b"
    - "\\bestablish\\b"
  PARAMETER:
    - "\\bparameter\\b"
    - "\\bvalue\\b"
    - "\\bfield\\b"
    - "\\bIE\\b"
  FAILURE:
    - "\\b(fail|failure|error|break)\\b"
    - "\\bunsuccessful\\b"
    - "\\bnot supported\\b"
  ERROR_HANDLING:
    - "\\berror handling\\b"
    - "\\bexception\\b"
    - "\\bwhen .* fails\\b"
  SECURITY:
    - "\\bsecurity\\b"
    - "\\bauthentication\\b"
    - "\\bencryption\\b"
    - "\\bintegrity\\b"
  COMPARISON:
    - "\\bvs\\.?\\b"
    - "\\bcompare\\b"
    - "\\bdifference\\b"
    - "\\bversus\\b"
  DEPENDENCY:
    - "\\bdepend(s|ed)? on\\b"
    - "\\brequires?\\b"
    - "\\bprerequisite\\b"
    - "\\bneeds?\\b"
  ARCHITECTURE:
    - "\\barchitecture\\b"
    - "\\boverview\\b"
    - "\\bcomponents?\\b"
    - "\\bstructure\\b"
  REQUIREMENT:
    - "\\bshall\\b"
    - "\\bmust\\b"
    - "\\brequirement\\b"
    - "\\bmandatory\\b"

document_metadata:
  - spec_number
  - release
  - version
  - document_type
  - title

judge_threshold: 0.8

# External AI model hooks (optional). The pipeline is deterministic and
# AI-free by default; enable an LLM only to use AI-as-judge / AI extraction /
# the improvement loop / AI-assisted ingestion. See docs/architecture.md
# §"AI as Judge" and ADR-0012.
#
# Multi-model routing: each pipeline task resolves to a named model. A task
# with no entry falls back to `default`. A flat `model:`/`provider:`/
# `api_base:`/`api_key:` block (the old single-model form) is treated as
# `default` for backward compatibility.
llm:
  enabled: true
  default:
    provider: ollama
    model: deepseek-v4-flash:0731-cloud
    api_base: http://localhost:11434        # e.g. http://localhost:8000/v1 for a local vLLM
    api_key: null                           # set via env (OPENAI_API_KEY) or here
    temperature: 0.1
    max_tokens: 1024
  models:
    extract:
      provider: ollama
      model: deepseek-v4-flash:0731-cloud
      temperature: 0.1
      max_tokens: 1024
    judge:
      provider: ollama
      model: minimax-m3:cloud
      temperature: 0.5
      max_tokens: 1024
    align:
      provider: ollama
      model: deepseek-v4-flash:0731-cloud
      temperature: 0.1
      max_tokens: 1024
    merge:
      provider: ollama
      model: deepseek-v4-flash:0731-cloud
      api_base: http://localhost:11434
      temperature: 0.1
      max_tokens: 1024
    domain_detect:
      provider: ollama
      model: deepseek-v4-flash:0731-cloud
      temperature: 0.1
      max_tokens: 256
    improve:
      provider: ollama
      model: deepseek-v4-flash:0731-cloud
      temperature: 0.1
      max_tokens: 1024
