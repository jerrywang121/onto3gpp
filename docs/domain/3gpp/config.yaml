# Domain: 3GPP
# This config drives the pipeline for 3GPP specifications.
# See docs/domain/_template/ for the schema.

domain: 3gpp

# ---------------------------------------------------------------------------
# Top-level ontology (TBox) — the blueprint / constraint for the ABox.
# concept_types are the TBox nodes; relation_type_constraints are the TBox
# edges (which relation types may connect which concept types). Curated here
# by default; AI may evolve it only when evidence demands (ADR-0010, ADR-0011).
# ---------------------------------------------------------------------------
concept_types:
  - network_function
  - procedure
  - information_element
  - interface
  - protocol
  - qos
  - architecture
  - security

relation_types:
  - is_a
  - part_of
  - uses
  - selects
  - participates_in
  - specified_in
  - related_to

# TBox edges: (source_type, rel, target_type). A relation in the ABox is valid
# only if its (source.type, rel, target.type) appears here.
relation_type_constraints:
  - {source_type: network_function, rel: uses, target_type: network_function}
  - {source_type: network_function, rel: selects, target_type: network_function}
  - {source_type: network_function, rel: participates_in, target_type: procedure}
  - {source_type: network_function, rel: uses, target_type: procedure}
  - {source_type: procedure, rel: uses, target_type: network_function}
  - {source_type: procedure, rel: uses, target_type: information_element}
  - {source_type: procedure, rel: part_of, target_type: procedure}
  - {source_type: information_element, rel: part_of, target_type: information_element}
  - {source_type: interface, rel: connects, target_type: network_function}
  - {source_type: protocol, rel: uses, target_type: interface}
  - {source_type: qos, rel: part_of, target_type: procedure}
  - {source_type: architecture, rel: part_of, target_type: architecture}
  - {source_type: security, rel: uses, target_type: procedure}
  - {source_type: network_function, rel: is_a, target_type: network_function}
  - {source_type: procedure, rel: is_a, target_type: procedure}
  - {source_type: information_element, rel: is_a, target_type: information_element}
  - {source_type: network_function, rel: specified_in, target_type: architecture}
  - {source_type: procedure, rel: specified_in, target_type: architecture}
  - {source_type: network_function, rel: related_to, target_type: network_function}
  - {source_type: procedure, rel: related_to, target_type: procedure}

intents:
  - DEFINITION
  - PURPOSE
  - PROCEDURE
  - MESSAGE_FLOW
  - CONFIGURATION
  - PARAMETER
  - FAILURE
  - ERROR_HANDLING
  - SECURITY
  - COMPARISON
  - DEPENDENCY
  - ARCHITECTURE
  - REQUIREMENT

# Deterministic query-intent classification patterns (Stage 3). Each intent
# maps to a list of regexes; a query is classified by counting regex matches
# (ties broken by the latest match position). See src/onto3gpp/runtime/intent.py.
intent_patterns:
  DEFINITION:
    - "\\bwhat is\\b"
    - "\\bwhat are\\b"
    - "\\bdefine\\b"
    - "\\bdefinition\\b"
    - "\\bmeaning\\b"
  PURPOSE:
    - "\\bwhy\\b"
    - "\\bpurpose\\b"
    - "\\bfor what\\b"
    - "\\bintended for\\b"
  PROCEDURE:
    - "\\bhow (does|is|are|do)\\b"
    - "\\bprocedure\\b"
    - "\\bprocess\\b"
    - "\\bsteps?\\b"
  MESSAGE_FLOW:
    - "\\bmessage flow\\b"
    - "\\bsignalling flow\\b"
    - "\\bsequence\\b"
    - "\\bexchange\\b"
  CONFIGURATION:
    - "\\bconfigure\\b"
    - "\\bconfiguration\\b"
    - "\\bsetup\\b"
    - "\\bestablish\\b"
  PARAMETER:
    - "\\bparameter\\b"
    - "\\bvalue\\b"
    - "\\bfield\\b"
    - "\\bIE\\b"
  FAILURE:
    - "\\b(fail|failure|error|break)\\b"
    - "\\bunsuccessful\\b"
    - "\\bnot supported\\b"
  ERROR_HANDLING:
    - "\\berror handling\\b"
    - "\\bexception\\b"
    - "\\bwhen .* fails\\b"
  SECURITY:
    - "\\bsecurity\\b"
    - "\\bauthentication\\b"
    - "\\bencryption\\b"
    - "\\bintegrity\\b"
  COMPARISON:
    - "\\bvs\\.?\\b"
    - "\\bcompare\\b"
    - "\\bdifference\\b"
    - "\\bversus\\b"
  DEPENDENCY:
    - "\\bdepend(s|ed)? on\\b"
    - "\\brequires?\\b"
    - "\\bprerequisite\\b"
    - "\\bneeds?\\b"
  ARCHITECTURE:
    - "\\barchitecture\\b"
    - "\\boverview\\b"
    - "\\bcomponents?\\b"
    - "\\bstructure\\b"
  REQUIREMENT:
    - "\\bshall\\b"
    - "\\bmust\\b"
    - "\\brequirement\\b"
    - "\\bmandatory\\b"

document_metadata:
  - spec_number
  - release
  - version
  - document_type
  - title

judge_threshold: 0.8

# External AI model hooks (optional). The pipeline is deterministic and
# AI-free by default; enable an LLM only to use AI-as-judge / AI extraction /
# the improvement loop / AI-assisted ingestion. See docs/architecture.md
# §"AI as Judge" and ADR-0012.
#
# Multi-model routing: each pipeline task resolves to a named model. A task
# with no entry falls back to `default`. A flat `model:`/`provider:`/
# `api_base:`/`api_key:` block (the old single-model form) is treated as
# `default` for backward compatibility.
llm:
  enabled: false
  default:
    provider: openai
    model: gpt-4o-mini
    api_base: null        # e.g. http://localhost:8000/v1 for a local vLLM
    api_key: null         # set via env (OPENAI_API_KEY) or here
    temperature: 0.0
    max_tokens: 1024
  models:
    extract:
      provider: openai
      model: gpt-4o-mini
      temperature: 0.0
      max_tokens: 1024
    judge:
      provider: openai
      model: gpt-4o
      temperature: 0.0
      max_tokens: 1024
    align:
      provider: openai
      model: gpt-4o-mini
      temperature: 0.0
      max_tokens: 1024
    merge:
      provider: ollama
      model: llama3
      api_base: http://localhost:11434
      temperature: 0.0
      max_tokens: 1024
    domain_detect:
      provider: openai
      model: gpt-4o-mini
      temperature: 0.0
      max_tokens: 256
    improve:
      provider: openai
      model: gpt-4o-mini
      temperature: 0.0
      max_tokens: 1024
