# Domain: 3GPP
# This config drives the pipeline for 3GPP specifications.
# See docs/domain/_template/ for the schema.

domain: 3gpp

concept_types:
  - network_function
  - procedure
  - information_element
  - interface
  - protocol
  - qos
  - architecture
  - security

relation_types:
  - is_a
  - part_of
  - uses
  - selects
  - participates_in
  - specified_in
  - related_to

intents:
  - DEFINITION
  - PURPOSE
  - PROCEDURE
  - MESSAGE_FLOW
  - CONFIGURATION
  - PARAMETER
  - FAILURE
  - ERROR_HANDLING
  - SECURITY
  - COMPARISON
  - DEPENDENCY
  - ARCHITECTURE
  - REQUIREMENT

document_metadata:
  - spec_number
  - release
  - version
  - document_type
  - title

judge_threshold: 0.8

# External AI model hooks (optional). The pipeline is deterministic and
# AI-free by default; enable an LLM only to use AI-as-judge / AI extraction /
# the improvement loop. See docs/architecture.md §"AI as Judge".
llm:
  enabled: false
  model: gpt-4o-mini
  provider: null        # e.g. openai, anthropic, ollama, vllm
  api_base: null        # e.g. http://localhost:8000/v1 for a local vLLM
  api_key: null         # set via env (OPENAI_API_KEY) or here
  temperature: 0.0
  max_tokens: 1024
