# Domain: 3GPP
# This config drives the pipeline for 3GPP specifications.
# See docs/domain/_template/ for the schema.

domain: 3gpp

intents:
  - DEFINITION
  - PURPOSE
  - PROCEDURE
  - MESSAGE_FLOW
  - CONFIGURATION
  - PARAMETER
  - FAILURE
  - ERROR_HANDLING
  - SECURITY
  - COMPARISON
  - DEPENDENCY
  - ARCHITECTURE
  - REQUIREMENT

# Deterministic query-intent classification patterns (Stage 3). Each intent
# maps to a list of regexes; a query is classified by counting regex matches
# (ties broken by the latest match position). See src/onto3gpp/runtime/intent.py.
intent_patterns:
  DEFINITION:
    - "\\bwhat is\\b"
    - "\\bwhat are\\b"
    - "\\bdefine\\b"
    - "\\bdefinition\\b"
    - "\\bmeaning\\b"
  PURPOSE:
    - "\\bwhy\\b"
    - "\\bpurpose\\b"
    - "\\bfor what\\b"
    - "\\bintended for\\b"
  PROCEDURE:
    - "\\bhow (does|is|are|do)\\b"
    - "\\bprocedure\\b"
    - "\\bprocess\\b"
    - "\\bsteps?\\b"
  MESSAGE_FLOW:
    - "\\bmessage flow\\b"
    - "\\bsignalling flow\\b"
    - "\\bsequence\\b"
    - "\\bexchange\\b"
  CONFIGURATION:
    - "\\bconfigure\\b"
    - "\\bconfiguration\\b"
    - "\\bsetup\\b"
    - "\\bestablish\\b"
  PARAMETER:
    - "\\bparameter\\b"
    - "\\bvalue\\b"
    - "\\bfield\\b"
    - "\\bIE\\b"
  FAILURE:
    - "\\b(fail|failure|error|break)\\b"
    - "\\bunsuccessful\\b"
    - "\\bnot supported\\b"
  ERROR_HANDLING:
    - "\\berror handling\\b"
    - "\\bexception\\b"
    - "\\bwhen .* fails\\b"
  SECURITY:
    - "\\bsecurity\\b"
    - "\\bauthentication\\b"
    - "\\bencryption\\b"
    - "\\bintegrity\\b"
  COMPARISON:
    - "\\bvs\\.?\\b"
    - "\\bcompare\\b"
    - "\\bdifference\\b"
    - "\\bversus\\b"
  DEPENDENCY:
    - "\\bdepend(s|ed)? on\\b"
    - "\\brequires?\\b"
    - "\\bprerequisite\\b"
    - "\\bneeds?\\b"
  ARCHITECTURE:
    - "\\barchitecture\\b"
    - "\\boverview\\b"
    - "\\bcomponents?\\b"
    - "\\bstructure\\b"
  REQUIREMENT:
    - "\\bshall\\b"
    - "\\bmust\\b"
    - "\\brequirement\\b"
    - "\\bmandatory\\b"

document_metadata:
  - spec_number
  - release
  - version
  - document_type
  - title

judge_threshold: 0.8

# AI provider/model config lives in config/app.yaml (app-level, not domain-level).
# Domain packs stay portable (intents, patterns, metadata, judge_threshold only).
# See ADR-0015 and config/app.yaml. Copying _template needs no AI edits.
