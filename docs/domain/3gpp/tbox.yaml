# Top-level ontology (TBox) — the blueprint / constraint for the ABox.
# concept_types are the TBox nodes; relation_type_constraints are the TBox
# edges (which relation types may connect which concept types). Curated here
# by default; AI may evolve it only when evidence demands (ADR-0010, ADR-0011).
# The `ingest` command writes the evolved TBox back to this file.
#
# This is the 3GPP telecom-domain TBox. It models the 5G System (5GS) /
# 5G Core (5GC) / NG-RAN domain: network functions, network entities, the
# service-based architecture (SBA), reference points, protocols, procedures,
# QoS, network slicing, security, mobility, and the states/parameters that
# describe them. Concept types are grouped by sub-domain for readability.

concept_types:
  # --- Core Network (5GC) / Service-Based Architecture ---
  - network_function        # AMF, SMF, UPF, AUSF, NRF, NSSF, PCF, UDM, UDR, NEF, NWDAF, ...
  - network_entity          # SCP, SEPP, UE, gNB, eNB, IAB-node, relay
  - network_service         # an NF service (Namf, Nsmf, Nudm, ...) exposed over SBA
  - network_slice           # S-NSSAI, NSSI, NSI (network slicing)

  # --- Access Network / Radio ---
  - access_network          # NG-RAN, E-UTRA, UTRAN, WLAN access
  - radio_access_type       # NR, LTE, GSM, WLAN, non-3GPP
  - cell                    # serving cell, neighbor cell, cell group
  - frequency_band          # band, carrier, frequency range (FR1/FR2)
  - connection              # RRC connection, PDU session, bearer connection

  # --- Interfaces / Reference Points ---
  - interface               # N1, N2, N3, N4, N6, N9, N11, N12, N13, N14, N15, N22, ...
  - reference_point         # point-to-point reference point (e.g. N11 between AMF/SMF)

  # --- Protocols ---
  - protocol                # NAS, RRC, PDCP, RLC, MAC, PHY, HTTP/2, SCTP, PFCP, NGAP, ...

  # --- Procedures / Behaviour ---
  - procedure               # registration, authentication, handover, paging, PDU session setup

  # --- Information / Data ---
  - information_element     # PDU Session ID, GUTI, TAI, S-NSSAI, QFI, RNTI, ...
  - parameter               # configuration parameter, field, attribute
  - message                 # NAS message, RRC message, control message, signal
  - data                    # user data, payload, content

  # --- QoS ---
  - qos                     # QoS Flow, 5QI, GBR, Non-GBR, QoS Rule, QoS Profile

  # --- Policy / Charging ---
  - policy                  # policy, policy control, charging policy
  - charging                # charging, charging data, rating

  # --- Security ---
  - security                # authentication, integrity protection, ciphering, key, credential

  # --- States ---
  - state                   # RRC_CONNECTED, RRC_IDLE, RRC_INACTIVE, CM-CONNECTED, RM-REGISTERED, ...

  # --- Channels / Bearers ---
  - channel                 # logical channel, transport channel, physical channel
  - bearer                  # DRB, SRB, EPS bearer, QoS flow, data radio bearer

  # --- Mobility / Location ---
  - mobility                # handover, mobility, tracking, reselection
  - location                # TAI, registration area, tracking area, cell location

  # --- Architecture / System ---
  - architecture            # 5GS, 5GC, EPS, NG-RAN architecture, SBA
  - system                  # 5G System, EPS, network system

  # --- Device / Equipment ---
  - device                  # UE, terminal, mobile station, equipment

  # --- Application / Energy ---
  - application             # application, service, 3rd-party service
  - energy                  # energy saving, energy information (EIF)

  # --- Generic ---
  - concept                 # generic concept (fallback)
  - entity                  # generic entity (fallback)

relation_types:
  - is_a
  - part_of
  - uses
  - selects
  - connects
  - establishes
  - updates
  - initiates
  - applies
  - maps
  - moves
  - forwards
  - handles
  - carries
  - provides
  - serves
  - manages
  - controls
  - transmits
  - specifies
  - specified_in
  - related_to
  - located_in
  - supports
  - requires
  - encapsulates
  - transfers

