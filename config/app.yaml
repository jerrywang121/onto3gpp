# App-level AI provider / model configuration (domain-agnostic).
# This file owns `providers` (per-provider wiring) + `llm` (enabled + default
# + per-task models) + `embed`. Domain packs (`docs/domain/*/config.yaml`)
# no longer contain AI config — they stay portable (intents, patterns,
# metadata, judge_threshold only). See ADR-0015 and docs/architecture.md §3.1.1.
#
# Secrets stay out of git: each provider declares `api_key_env` — the env var
# name that carries the key (e.g. COMMAND_CODE_API_KEY, OPENAI_API_KEY).
# Ollama/local needs no key. The loader resolves `api_key` as:
# explicit api_key → os.getenv(api_key_env) → None. Model sections just
# reference `provider: <name>` without repeating api_base/api_key_env.

providers:
  # CommandCode gateway (OpenAI-compatible, needs COMMAND_CODE_API_KEY)
  cmdc:
    api_base: https://api.commandcode.ai/provider/v1
    api_key_env: COMMAND_CODE_API_KEY
  # OpenAI cloud (needs OPENAI_API_KEY) — uncomment to use
  openai:
    api_key_env: OPENAI_API_KEY
  # Ollama local (no key)
  ollama:
    api_base: http://localhost:11434

llm:
  enabled: true
  default:
    provider: cmdc
    model: minimax/minimax-m3-free
    temperature: 0.5
    max_tokens: 4096
  models:
    extract:       {provider: cmdc, model: poolside/laguna-s-2.1-free, temperature: 0.1, max_tokens: 8000}
    verify:        {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.3, max_tokens: 8000}
    relations:     {provider: cmdc, model: poolside/laguna-s-2.1-free, temperature: 0.3, max_tokens: 8000}
    judge:         {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.5, max_tokens: 8000}
    align:         {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.5, max_tokens: 8000}
    merge:         {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.5, max_tokens: 8000}
    domain_detect: {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.5, max_tokens: 8000}
    improve:       {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.8, max_tokens: 8000}
  # To swap a task to another provider, just change `provider:`:
  #   merge: {provider: ollama, model: llama3, temperature: 0.5}
  #   judge: {provider: openai, model: gpt-4o, temperature: 0.0}

embed:
  kind: ollama
  api_base: http://localhost:11434
  model: embeddinggemma:300m
  dim: 768
  num_ctx: 2048
  threshold: 0.25
  top_k: 5
  # qwen variant (heavier 2.13 GB, 1.6s/32 vs 0.68 GB 1.07s/32 — needs num_ctx cap):
  # kind: ollama
  # model: qwen3-embedding:0.6b
  # dim: 1024
  # num_ctx: 2048
  # local fast alternative (no ollama daemon, 0.46s/32, 6.4s cold once per process):
  # kind: gguf
  # repo_id: unsloth/embeddinggemma-300m-GGUF
  # filename: embeddinggemma-300M-BF16.gguf
  # dim: 768
  # n_gpu_layers: -1
  # resident server alternative (requires `llama serve -hf ... --embeddings`
  # but currently crashes on cublasCreate/resource allocation on RTX 2000 Ada):
  # kind: api
  # api_base: http://127.0.0.1:8080/v1
  # model: unsloth/embeddinggemma-300m-GGUF:BF16
  # local hash fallback (no model download):
  # kind: hash
  # dim: 384
  # ollama alternative (requires daemon):
  # kind: ollama
  # provider: ollama
  # model: embeddinggemma:300m
  # api example (customer-defined endpoint):
  # kind: api
  # provider: openai
  # model: text-embedding-3-small
  # dim: 1536
