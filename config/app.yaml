# App-level AI provider / model configuration (domain-agnostic).
# This file owns `providers` (per-provider wiring) + `llm` (enabled + default
# + per-task models) + `embed`. Domain packs (`docs/domain/*/config.yaml`)
# no longer contain AI config — they stay portable (intents, patterns,
# metadata, judge_threshold only). See ADR-0015 and docs/architecture.md §3.1.1.
#
# Secrets stay out of git: each provider declares `api_key_env` — the env var
# name that carries the key (e.g. COMMAND_CODE_API_KEY, OPENAI_API_KEY).
# Ollama/local needs no key. The loader resolves `api_key` as:
# explicit api_key → os.getenv(api_key_env) → None. Model sections just
# reference `provider: <name>` without repeating api_base/api_key_env.

providers:
  # CommandCode gateway (OpenAI-compatible, needs COMMAND_CODE_API_KEY)
  cmdc:
    api_base: https://api.commandcode.ai/provider/v1
    api_key_env: COMMAND_CODE_API_KEY
  # OpenAI cloud (needs OPENAI_API_KEY) — uncomment to use
  openai:
    api_key_env: OPENAI_API_KEY
  # Ollama local (no key)
  ollama:
    api_base: http://localhost:11434

llm:
  enabled: true
  default:
    provider: cmdc
    model: minimax/minimax-m3-free
    temperature: 0.5
    max_tokens: 4096
  models:
    extract:       {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.1, max_tokens: 4096}
    verify:        {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.3, max_tokens: 4096}
    relations:     {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.3, max_tokens: 4096}
    judge:         {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.5, max_tokens: 4096}
    align:         {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.5, max_tokens: 4096}
    merge:         {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.5, max_tokens: 4096}
    domain_detect: {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.5, max_tokens: 2048}
    improve:       {provider: cmdc, model: minimax/minimax-m3-free, temperature: 0.8, max_tokens: 4096}
  # To swap a task to another provider, just change `provider:`:
  #   merge: {provider: ollama, model: llama3, temperature: 0.5}
  #   judge: {provider: openai, model: gpt-4o, temperature: 0.0}

embed:
  kind: hash
  dim: 384
  threshold: 0.25
  top_k: 5
  # hash/tfidf need no provider. For API embeddings, reference a provider:
  # kind: api
  # provider: cmdc
  # model: <embedding-model>
  # dim: <model-dim>
  # ollama example (local, no key):
  # kind: ollama
  # provider: ollama
  # model: embeddinggemma:300m
  # dim: 768
  # openai example:
  # kind: api
  # provider: openai
  # model: text-embedding-3-small
  # dim: 1536
